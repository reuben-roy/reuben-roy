name: Generate GitHub metrics

on:
  # Refresh once a day
  schedule:
    - cron: "30 0 * * *"
  # Manual trigger from the Actions tab
  workflow_dispatch:

# NOTE: this workflow commits the generated SVGs back to `main`, so it is
# intentionally NOT triggered on push (that would create a commit loop).
# Requires a classic personal access token in the METRICS_TOKEN secret.
# No additional scopes are needed for public metrics.

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview — stats, languages, activity
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: reuben-roy
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Phoenix
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_lines: yes
          # Habits is disabled until upstream handles push events without commits.

      - name: 3D isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: github-isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: reuben-roy
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
