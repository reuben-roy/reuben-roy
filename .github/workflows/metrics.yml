name: Generate GitHub metrics

on:
  # Refresh once a day
  schedule:
    - cron: "30 0 * * *"
  # Manual trigger from the Actions tab
  workflow_dispatch:

# NOTE: this workflow commits the generated SVGs back to `main`, so it is
# intentionally NOT triggered on push (that would create a commit loop).
# Requires a repo secret named METRICS_TOKEN — a Personal Access Token
# (classic, with `repo` scope, or a fine-grained token with read access to
# your repos + metadata). See the setup checklist in the PR / handoff notes.

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview — stats, languages, activity, habits
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: reuben-roy
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Phoenix
          config_theme: github_dark
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: 3D isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: github-isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: reuben-roy
          base: ""
          config_theme: github_dark
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
